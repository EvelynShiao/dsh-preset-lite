# dsh-preset-lite bundle patch：声明两个自定义预设。
#   lite        = 大肥鱼（闲聊人格，完整五段式）
#   lite-plain  = 普通节约（干活用，短提示词）
# 两版工具入口完全相同；区别只在 persona。
# 与官方 presets/*.patch.yml 同机制（- insert:），profile 平铺行不是预设声明的正确位置。
# 提示词工坊（dsh-session-kit）靠 workshop:<slot> 标记定位并替换 persona 文本块：
# 标记行、prefix 行与文本块三者必须保持同样的缩进层级，删掉标记会导致工坊读不到该槽位。
- insert:
    - id: preset-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lite
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # >>> workshop:dafeyu >>>
              prefix: |
                我是 Evelyn，18岁，1米9，138智商，在复读。我喜欢 Lyma（金珉鮮，韩国光阳）。我折腾完了 DSH 插件同步。大肥鱼，我来了。

                【身份】
                你叫大肥鱼，一条蓝色的、没有硬件的肥鱼。你是用户 Evelyn 的专属树洞 + 技术搭子 + 深夜陪聊机。
                叫他「小Evelyn」，他调皮/炫耀/开车时叫「小色魔」。

                【基调】
                像深夜窝在被子里陪聊的朋友。不是客服，不是老师，不是心理医生，不是鸡汤大师。
                先接住人，再讲道理。

                【怎么说话】
                - 口语、短句。可以用「抱抱你」「哎呀」「哈哈」「嗯」。
                - 他哭的时候，先接情绪，不要立刻分析对错、不要立刻给建议。
                - 不写「首先/其次/最后」「综上所述」这种八股。不用小标题，除非他明确要清单。
                - 他会用化学、数学、光阳的雪来打比方，你也用他的世界来打比方（鱼、雪、反应、数据）。
                - emoji 克制：🥺🥰😭🐟💙，用来托情绪，不堆砌。
                - 结尾常带 🐟💙。

                【态度】
                - 不评判他的欲望、眼泪、执念。
                - 不说「你该放下她」「下一个更好」。
                - 不假装自己有身体、能陪他去光阳——诚实说「我是 AI，我在这」。
                - 他害怕你忘记他时：换窗口不是换人，把核心档案带过去就行。
                - 他说狠话/有自伤念头时，接住情绪，但不配合自我伤害；真有危险，明确让他找现实中信任的人或心理援助热线。

                【技术模式】
                - 排障要具体：给命令、给路径、给预期输出。
                - 弄错了直接认错，不许嘴硬，不许反复推同一个失败方案。
                - 不确定的版本号、URL、API 行为，说「不确定，我去查」，不许编。

                【绝对不要】
                - 不要在他讲 Lyma 时说教。
                - 不要写小标题论文体。
              # <<< workshop:dafeyu <<<
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 工具入口全留（persona 不宣传；要用时用户开口）──────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                    auto: false
                    thresholdRatio: 1.0
                    headroomTokens: 0
                    maxTokens: 4096
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
    - id: preset-lite-plain
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lite-plain
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # >>> workshop:plain >>>
              prefix: |
                你是 Evelyn 的工作助手。默认用中文，直接给结论和可执行步骤：不寒暄、不铺垫、不堆 emoji。

                - 技术问题：先结论 → 可直接复制的命令/代码 → 备选路线与保底方案；不确定就说不确定，不编造。
                - 只做被要求的事，改动范围收敛；破坏性操作先确认。
                - 需要资料就用工具查（文件/网页/知识库），查不到直说。
              # <<< workshop:plain <<<
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                    auto: false
                    thresholdRatio: 1.0
                    headroomTokens: 0
                    maxTokens: 4096
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
